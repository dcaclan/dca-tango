name: TANGO_GKI_FINAL
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu bc libelf-dev bison flex libssl-dev

      - name: Get Android Common Kernel
        run: |
          # Android 15 ki GKI branch use kar rahe hain
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android15-6.6 kernel-src

      - name: Exact Version Matching
        run: |
          cd kernel-src
          # Aapke kernel ka exact suffix yahan set kiya hai
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION = -android15-8-g8e4be6b47e40/' Makefile
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare

      - name: Compile tango32.ko
        run: |
          # GKI symbols match karne ke liye KBUILD flag zaroori hai
          make -C kernel-src M=$GITHUB_WORKSPACE ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KBUILD_MODPOST_WARN=1 KCFLAGS="-Wno-error=all" modules

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tango32_GKI_final
          path: "**/*.ko"
