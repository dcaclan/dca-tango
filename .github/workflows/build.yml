name: TANGO_GKI_FINAL_DEV
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu bc libelf-dev bison flex libssl-dev

      - name: Get Android Common Kernel (GKI 6.6)
        run: |
          # Android 15-6.6 base branch for your kernel
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android15-6.6 kernel-src

      - name: Match Kernel Version & Config
        run: |
          cd kernel-src
          # Exact version string alignment
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION = -android15-8/' Makefile
          # GKI config load karna zaroori hai section size mismatch fix karne ke liye
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare

      - name: Build tango32.ko
        run: |
          # LOCALVERSION ko exact match ke liye split kiya gaya hai
          make -C kernel-src M=$GITHUB_WORKSPACE ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          LOCALVERSION="-g8e4be6b47e40-ab14134548-4k" \
          KBUILD_MODPOST_WARN=1 KCFLAGS="-Wno-error=all" modules

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tango32_fixed_gki
          path: "**/*.ko"
