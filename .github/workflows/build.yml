name: TANGO_FIX_6_6
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc-aarch64-linux-gnu bc libelf-dev bison flex libssl-dev
      - name: Kernel
        run: git clone --depth=1 https://github.com/torvalds/linux.git -b v6.6 kernel-src
      - name: Compile
        run: |
          cd kernel-src
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          # Linking fix for undefined symbols
          cp -f System.map ../System.map || true
          cd ..
          make -C kernel-src M=$GITHUB_WORKSPACE ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KBUILD_MODPOST_WARN=1 KCFLAGS="-Wno-error=all" modules
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tango32_ko
          path: "**/*.ko"
