name: TANGO_A16_FINAL_FIX
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Tools
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc-aarch64-linux-gnu bc libelf-dev bison flex libssl-dev

      - name: Get Android Common Kernel
        run: git clone --depth=1 https://android.googlesource.com/kernel/common -b android15-6.6 kernel-src

      - name: Exact Version Matching (Limit Fix)
        run: |
          cd kernel-src
          # Character limit error se bachne ke liye sirf base suffix yahan rakha hai
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION = -android15-8/' Makefile
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare

      - name: Compile tango32.ko
        run: |
          # Baaki ka version magic LOCALVERSION ke zariye exact match kar rahe hain
          make -C kernel-src M=$GITHUB_WORKSPACE ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
          LOCALVERSION="-g8e4be6b47e40-ab14134548-4k" \
          KBUILD_MODPOST_WARN=1 KCFLAGS="-Wno-error=all" modules

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tango32_final_a16
          path: "**/*.ko"
