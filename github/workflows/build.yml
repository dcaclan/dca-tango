name: TANGO_BUILD_DCA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu bc libelf-dev bison flex libssl-dev

      - name: Get Kernel
        run: git clone --depth=1 https://github.com/torvalds/linux.git -b master kernel-src

      - name: Build Module
        run: |
          cd kernel-src
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          cd ..
          make -C $GITHUB_WORKSPACE/kernel-src M=$GITHUB_WORKSPACE ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tango32_ko_driver
          path: ./*.ko
